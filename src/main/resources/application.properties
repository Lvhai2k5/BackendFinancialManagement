spring.application.name=FinanceManagement
# Bí mật (DB, JWT, mật khẩu seed) KHÔNG nằm trong file này: tự nạp từ .env (gitignore)
# cùng thư mục chạy, hoặc từ biến môi trường hệ thống.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Mặc định 8080 khớp Mobile (Env.apiBaseUrl) và Web (VITE_PROXY_TARGET).
# Máy bận 8080 thì đặt SERVER_PORT trong .env rồi trỏ client sang cổng đó.
server.port=${SERVER_PORT:8080}

# JWT: access 30 phút, refresh 7 ngày (TECH-AUTH.md). JWT_SECRET >= 32 ký tự.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=30
app.jwt.refresh-days=7

# Đăng nhập Google: Client ID loại "Web application" tạo ở Google Cloud Console, dùng chung với Web/Mobile.
# Để trống => POST /api/v1/auth/google trả 503 (tính năng chưa bật).
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Gửi OTP qua Gmail SMTP. MAIL_USERNAME = địa chỉ Gmail, MAIL_PASSWORD = "Mật khẩu ứng dụng"
# (App Password 16 ký tự, KHÔNG phải mật khẩu đăng nhập Gmail). Để trống MAIL_USERNAME => không gửi mail,
# chỉ in OTP ra log (dùng khi dev).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from-name=FinNest

# OTP: chỉ khi CHƯA cấu hình mail thì OTP_FIXED_CODE (nếu có) mới được dùng làm mã cố định cho dev;
# khi đã bật gửi mail thật, mã luôn ngẫu nhiên 6 số.
app.otp.fixed-code=${OTP_FIXED_CODE:}
app.otp.ttl-minutes=5

# Tài khoản admin demo + dữ liệu mẫu: chỉ tạo khi SEED_ADMIN_PASSWORD có giá trị
app.seed.admin-username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html

# Ghi chi tiêu bằng giọng nói (Gemini). Lấy key ở https://aistudio.google.com/apikey, KHÔNG commit key.
# Bỏ trống GEMINI_API_KEY => POST /api/v1/voice/parse trả 503.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.gemini.thinking-level=${GEMINI_THINKING_LEVEL:low}
app.gemini.timeout-seconds=20
