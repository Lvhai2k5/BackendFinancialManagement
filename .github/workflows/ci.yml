name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chặng 1-3: build + test + coverage (JaCoCo gọi qua CLI, không cần sửa pom.xml)
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/ci
      DB_USERNAME: ci
      DB_PASSWORD: ci
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      OTP_FIXED_CODE: '123456'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build + test + coverage
        run: >
          ./mvnw -B -ntp
          org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent
          verify
          org.jacoco:jacoco-maven-plugin:0.8.12:report
      - name: Coverage summary
        if: always()
        run: |
          f=target/site/jacoco/jacoco.csv
          if [ -f "$f" ]; then
            awk -F, 'NR>1{m+=$4;c+=$5} END{printf "### Line coverage: %.1f%%\n", c*100/(m+c)}' "$f" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-and-coverage
          path: |
            target/surefire-reports
            target/site/jacoco

  # Chặng 4: phân tích tĩnh (SpotBugs)
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: SpotBugs
        run: >
          ./mvnw -B -ntp -DskipTests compile
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
          -Dspotbugs.threshold=High

  # Chặng 5: quét secret + dependency
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # Chặng 6: đóng gói Docker (+ quét image); chỉ push GHCR khi vào develop/main
  docker:
    needs: [build-test, static-analysis, gitleaks, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/backend:scan
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
          cache-from: type=gha

  # Chặng 7: deploy tự động (bỏ qua có cảnh báo nếu chưa cấu hình secret)
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::Chưa cấu hình STAGING_DEPLOY_HOOK, bỏ qua deploy"; exit 0; fi
          curl -fsS -X POST "$HOOK"
      - name: Health check
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::warning::Chưa có STAGING_URL, bỏ qua health check"; exit 0; fi
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/v3/api-docs" || true)
            if [ "$code" = "200" ]; then echo "OK sau $i lần thử"; exit 0; fi
            sleep 10
          done
          echo "Health check thất bại"; exit 1

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    environment: production   # cần reviewer duyệt
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.PROD_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::Chưa cấu hình PROD_DEPLOY_HOOK, bỏ qua deploy"; exit 0; fi
          curl -fsS -X POST "$HOOK"
      - name: Health check
        env:
          URL: ${{ vars.PROD_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::warning::Chưa có PROD_URL, bỏ qua health check"; exit 0; fi
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/v3/api-docs" || true)
            if [ "$code" = "200" ]; then echo "OK sau $i lần thử"; exit 0; fi
            sleep 10
          done
          echo "Health check thất bại"; exit 1
